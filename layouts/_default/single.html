{{ define "main" }}
<article style="max-width: 720px; margin: 0 auto; padding: 60px 24px;">
  <header style="margin-bottom: 40px;">
    <h1 style="font-size: 2.2rem; font-weight: 700; color: #f1f5f9; margin-bottom: 12px; line-height: 1.3;">{{ .Title }}</h1>
    <time style="font-size: 0.92rem; color: #94a3b8;">{{ .Date.Format "2006年1月2日" }}</time>
  </header>

  <div style="color: #e2e8f0; line-height: 1.8; font-size: 1.05rem;">
    {{ .Content }}
  </div>

  <footer style="margin-top: 60px; padding-top: 24px; border-top: 1px solid #334155;">
    <a href="/posts/" style="color: #818cf8; text-decoration: none; font-size: 0.92rem;">← 返回文章列表</a>
  </footer>
</article>
{{ end }}
