{{ define "main" }}
<div style="max-width: 640px; margin: 0 auto; padding: 120px 24px 80px; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">

  <img src="/1.jpg" alt="didididi"
       style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #334155; margin-bottom: 24px; box-shadow: 0 0 0 4px rgba(129,140,248,0.15);">

  <h1 style="font-size: 2.2rem; font-weight: 700; color: #f1f5f9; margin: 0 0 12px 0; letter-spacing: -0.5px; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;">
    didididi
  </h1>

  <p style="font-size: 1rem; color: #94a3b8; margin: 0 0 40px 0; line-height: 1.8; font-family: 'Noto Sans SC', sans-serif;">
    踩坑记录 · 学习笔记 · 项目总结
  </p>

  <a href="/posts/"
     style="display: inline-block; background: #818cf8; color: #0f172a; padding: 10px 28px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.92rem; font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif; letter-spacing: 0.02em; transition: opacity 0.2s;"
     onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
    查看文章 →
  </a>

</div>
{{ end }}
