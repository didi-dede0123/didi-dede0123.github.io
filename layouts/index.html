{{ define "main" }}
<div style="max-width: 700px; margin: 0 auto; padding: 80px 24px; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">

  <!-- 头像 + 名字 -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 28px;">
    <img src="/1.jpg" alt="didididi"
         style="width: 96px; height: 96px; border-radius: 50%; border: 3px solid #e2e8f0; object-fit: cover;">
    <h1 style="font-size: 2.6rem; font-weight: 700; color: #111827; margin: 0; letter-spacing: -0.5px;">
      didididi
    </h1>
  </div>

  <!-- 介绍 -->
  <p style="font-size: 1.2rem; color: #1f2937; margin: 0 0 8px 0;">
    你好，我是 didididi。
  </p>
  <p style="font-size: 1.1rem; color: #4b5563; margin: 0 0 32px 0;">
    这里会记录：踩坑记录 · 学习笔记 · 项目总结
  </p>

  <!-- 按钮 -->
  <div>
    <a href="/posts/"
       style="display: inline-block; background: #2563eb; color: #fff; padding: 10px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: background 0.2s;">
      查看博客 →
    </a>
  </div>

</div>
{{ end }}
